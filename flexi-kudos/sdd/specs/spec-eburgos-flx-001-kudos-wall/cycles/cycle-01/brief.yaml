cycle: 1
module: kudos-wall
phase: core-e2e
date: 2026-08-24
spec: spec-eburgos-flx-001-kudos-wall
apps:
  - apps/api
  - apps/webapp
  - libs/shared-types

app_context:
  api: sdd/context/apps/api/context_prompt.md
  webapp: sdd/context/apps/webapp/context_prompt.md
  shared_types: sdd/context/libs/shared-types/context_prompt.md

objective: |
  Entregar el núcleo end-to-end del muro de kudos: API REST NestJS + Postgres + DTOs
  compartidos + vista de muro y formulario de alta en React, cubriendo RF-1 a RF-6 y
  todos los RNF de la spec, con el happy path (CA-001) verde al cierre.

scope:
  - Endpoint POST /v1/kudos con validación de negocio (S-3, S-4), rate limit 60 req/min por IP (RNF-4) y respuesta 201 con DTO expandido
  - Endpoint GET /v1/kudos con paginación por cursor sobre (created_at desc, id desc), defaults limit=20 y cap 50
  - Endpoint GET /v1/members (lista fija seedeada, orden alfabético) y GET /v1/categories (enum fijo con label presentable)
  - Endpoint GET /healthz (RNF-6)
  - Migración/es de Postgres para tablas members y kudos (mecanismo lo decide el architect entre TypeORM/Prisma según constitución de apps/api)
  - Seed de miembros del equipo (mínimo 6) y opcional seed de kudos para CA-010
  - DTOs en libs/shared-types (MemberDto, CategoryDto, KudoDto, CreateKudoRequest, KudoListResponse) publicados y consumidos por API y webapp
  - Ruta / del webapp con grilla responsive de tarjetas, estado vacío y botón "Cargar más"
  - Ruta /nuevo (o modal) del webapp con formulario controlado, validación cliente y feedback de errores
  - Formato de error uniforme { error:{code, message, details?}} con los códigos de RNF-5
  - Logs estructurados JSON con request_id (RNF-6)
  - Tests unitarios de servicios de validación + e2e supertest (happy path + 3 errores clave) en apps/api
  - Tests de render del muro y validación del formulario en apps/webapp
  - docker-compose de Postgres levantado en la raíz del monorepo (si no existe, agregarlo)

out_of_scope:
  - Autenticación / login / SSO
  - Roles (admin, moderador)
  - Edición o borrado de kudos
  - Reacciones o comentarios
  - Notificaciones (mail, Slack)
  - Multi-equipo / multi-tenant
  - Real-time / websockets
  - Métricas agregadas (rankings)
  - Scroll infinito automático (v1 usa "Cargar más")
  - i18n (solo español rioplatense)

