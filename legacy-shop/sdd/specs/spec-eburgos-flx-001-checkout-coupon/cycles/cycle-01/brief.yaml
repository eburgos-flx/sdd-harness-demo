      de negocio del descuento (base de cálculo, redondeo, umbral de envío, motivos de
      rechazo) explicitadas y sin ambigüedad para el planner y el arquitecto.
    business_context: >
      Tienda interna de accesorios de escritorio. Hoy las promociones se resuelven a mano
      corrigiendo precios después de la compra. El cupón permite definir una campaña
      agregando una entrada al JSON del store, sin tocar precios de productos, y deja el
      descuento registrado en la orden.
    relevant_spec_sections:
