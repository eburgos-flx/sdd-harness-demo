cycle: 1
module: checkout-coupon
phase: checkout-discount
date: 2026-08-24
app_context: sdd/context/apps/legacy-shop/context_prompt.md

objective: |
  Quien compra puede ingresar un código de cupón en el checkout, ver el descuento
  porcentual aplicado sobre el subtotal antes de confirmar, y confirmar la compra con
  ese descuento revalidado en el servidor.

scope:
  - Colección `coupons` en server/data/store.json, leída por accessors de server/src/store.js
  - Endpoint de validación previa del cupón (no muta carrito ni crea orden)
  - POST /checkout acepta el código, lo revalida y recalcula totales con descuento
  - La orden confirmada registra cupón, porcentaje y monto descontado
  - Campo de cupón en client/src/components/CheckoutForm.jsx: aplicar, ver, quitar, error

out_of_scope:
  - ABM de cupones por UI o API (se editan a mano en el JSON del store)
  - Límites de uso por persona o por cupón (no hay persistencia ni identidad)
  - Cupones de monto fijo, envío gratis, 2x1 o restricciones por producto/categoría
  - Mostrar el descuento en CartDrawer (el cupón vive en el paso de checkout)
  - Refactor de la deuda del handler /checkout (duplicación de calcTotals, envío hardcodeado)
  - Introducir framework de tests

dependencies_required: []

